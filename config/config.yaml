  # Data timeframe for analysis
  timeframe: "2y" # history to fetch; the ML model needs >1 year (SMA-200 alone needs 200 days)
  interval: "1d" # Daily intervals

  # Market hours (EST)
  market_hours:
    open: "09:30"
    close: "16:00"
    timezone: "US/Eastern"

# Technical Analysis Configuration
technical_analysis:
  indicators:
    rsi:
      period: 14
      overbought: 70
      oversold: 30

    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9

    bollinger_bands:
      period: 20
      std_dev: 2

    moving_averages:
      sma_periods: [5, 10, 20, 50, 200]
      ema_periods: [5, 10, 20, 50]

    volume_analysis:
      volume_sma_period: 20
      volume_spike_threshold: 2.0

    support_resistance:
      lookback_period: 50
      min_touches: 2

# Machine Learning Configuration
# One model set is trained per run on the pooled history of every symbol.
ml_config:
  models:
    random_forest:
      enabled: true
      n_estimators: 200
      max_depth: 6
      min_samples_leaf: 20
      random_state: 42

    xgboost:
      enabled: true
      n_estimators: 200
      max_depth: 3
      learning_rate: 0.05
      random_state: 42

    neural_network: # scikit-learn MLP, no TensorFlow needed
      enabled: true
      hidden_layers: [64, 32]
      alpha: 0.001
      max_iter: 200

    lstm: # requires `pip install tensorflow`; not used in the ensemble score
      enabled: false
      units: [32]
      epochs: 20
      sequence_length: 20

  training:
    test_size: 0.2 # last 20% of dates held out to report accuracy
    cross_validate: true
    cv_splits: 3
    min_samples: 200
    target_threshold: 0.0 # "up" means next close > today's close by more than this

# Ranking System Configuration
ranking_config:
  weights:
    technical_score: 0.30
    ml_prediction: 0.25
    momentum_score: 0.20
    volume_score: 0.15
    sentiment_score: 0.10

  filters:
    min_volume: 1000000 # Minimum daily volume
    min_price: 5.0 # Minimum stock price
    max_price: 1000.0 # Maximum stock price
    exclude_penny_stocks: true

  top_picks: 10
  use_sentiment: true # news/sector/VIX sentiment (slow: several extra requests per stock)

# Backtest Configuration (python src/cli.py backtest)
backtest:
  period: "2y" # history to fetch
  test_days: 120 # most recent trading days to simulate
  retrain_every: 20 # trading days between ML retrains (walk-forward)
  min_train_days: 120 # history required before the first ML model is trained
  cost_bps: 5 # one-way transaction cost in basis points

# API Configuration
api_config:
  rate_limits:
    yfinance: 7200 # requests per hour (0.5s between requests)
    alpha_vantage: 500 # requests per day

  retry_attempts: 3
  timeout: 30

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/stock_predictor.log"

# Notification Configuration
notifications:
  email:
    enabled: false
    smtp_server: ""
    smtp_port: 587
    username: ""
    password: ""
    recipients: []

  discord:
    enabled: false
    webhook_url: ""

# Scheduler Configuration
scheduler:
  daily_analysis_time: "18:00" # 6 PM EST (after market close)
  timezone: "US/Eastern"
