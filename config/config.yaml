    timeframe: "2y" # history fetched; the ML model needs more than a year
    periods_per_year: 252 # trading days, used to annualize returns and volatility
    use_sentiment: true # news/sector/VIX sentiment (slow: extra requests per stock)
    filters:
      min_price: 5.0
      max_price: 0 # 0 = no maximum
      min_volume: 1000000 # average daily shares traded
      min_market_cap: 1000000000 # live only; skipped when unknown
      exclude_penny_stocks: true
    portfolio:
      max_per_sector: 3 # at most this many picks from one sector
      weighting: "inverse_volatility" # or "equal"

  crypto:
    label: "Crypto"
    # Major coins quoted in USD on Yahoo Finance; trade 7 days a week
    symbols:
      - BTC-USD
      - ETH-USD
      - BNB-USD
      - SOL-USD
      - XRP-USD
      - ADA-USD
      - DOGE-USD
      - TRX-USD
