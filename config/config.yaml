      - NEAR-USD
      - ICP-USD
      - AAVE-USD
      - ALGO-USD
    timeframe: "2y"
    periods_per_year: 365
    use_sentiment: false # VIX and sector ETFs do not apply to crypto
    filters:
      min_price: 0
      max_price: 0
      min_volume: 10000000 # Yahoo reports crypto volume in USD
      min_market_cap: 1000000000
      exclude_penny_stocks: false
    portfolio:
      max_per_sector: 0 # 0 = no sector cap
      weighting: "inverse_volatility"

# Technical Analysis Configuration
technical_analysis:
  indicators:
    rsi:
      period: 14
      overbought: 70
      oversold: 30
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    bollinger_bands:
      period: 20
      std_dev: 2
    stochastic:
      k_period: 14
      d_period: 3
    atr:
      period: 14
    adx:
      period: 14
    cci:
      period: 20

# Machine Learning Configuration
# One model set is trained per universe per run, on the pooled history of every symbol.
ml_config:
  models:
    random_forest:
      enabled: true
      n_estimators: 200
      max_depth: 6
      min_samples_leaf: 20
      random_state: 42

    xgboost:
      enabled: true
      n_estimators: 200
      max_depth: 3
      learning_rate: 0.05
      random_state: 42

    neural_network: # scikit-learn MLP, no TensorFlow needed
      enabled: true
      hidden_layers: [64, 32]
      alpha: 0.001
      max_iter: 200

    lstm: # requires `pip install tensorflow`; not used in the ensemble score
      enabled: false
      units: [32]
      epochs: 20
      sequence_length: 20

  training:
    # "relative": predict beating the universe's average return over the horizon
    #             (removes the market move, which no stock feature can predict)
    # "absolute": predict the price going up
    target: "relative"
    horizon: 5 # trading days ahead (calendar days for crypto)
    target_threshold: 0.0 # absolute target only: minimum return counted as "up"
    test_size: 0.2 # last 20% of dates held out (after a purge gap) to measure quality
    cross_validate: true
    cv_splits: 3
    min_samples: 200
    calibrate: true # map raw model output to observed hold-out frequencies

# Volatility forecast (separate model, see docs/ARCHITECTURE.md)
volatility:
  enabled: true
  horizon: 5 # predict realized volatility over the next N days

# Ranking System Configuration
ranking_config:
  weights:
    technical_score: 0.25
    ml_prediction: 0.35
    momentum_score: 0.20
    volume_score: 0.10
    sentiment_score: 0.10
  top_picks: 10

# Backtest Configuration
backtest:
  period: "2y" # history to fetch
  test_days: 120 # most recent days to simulate
  retrain_every: 20 # days between ML retrains (walk-forward)
  min_train_days: 120 # history required before the first ML model is trained
  cost_bps: 5 # one-way transaction cost in basis points (crypto: consider 10-20)

# Prediction tracking (FastAPI app): every analysis is stored and scored once its horizon has passed
tracking:
  database: "data/predictions.db"

# Daily automatic analysis in the API server
scheduler:
  enabled: false
  time: "22:30" # local server time, after the US close
  universes: ["stocks", "crypto"]

# Data source configuration
api_config:
  rate_limits:
    yfinance: 7200 # requests per hour (0.5s between requests)
    alpha_vantage: 500 # requests per day
  retry_attempts: 3
  timeout: 30

# Logging Configuration
logging:
  level: "INFO"
  file: "logs/stock_predictor.log"
