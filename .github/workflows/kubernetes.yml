# Checks the Helm chart and kube.sh end to end on a throwaway k3d cluster:
#   1. chart: helm lint and schema validation of the rendered manifests
#   2. deploy: ./kube.sh up, the chart's tests, a prediction job, its results

name: Kubernetes

on:
  push:
    branches: [main]
    paths: &deploy_paths
      - deploy/**
      - kube.sh
      - scripts/**
      - Dockerfile
      - requirements.txt
      - api/**
      - src/**
      - config/**
      - .github/workflows/kubernetes.yml
      - .github/scripts/**
  pull_request:
    paths: *deploy_paths
  workflow_dispatch:

concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.6.7
  K8S_VERSION: 1.31.0

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Lint and validate each profile
        run: |
          chart=deploy/helm/ledger
          for values in "" values-laptop.yaml values-desktop.yaml; do
            for mode in demo live; do
              args=(--set mode=$mode --set-file configFile=config/config.yaml)
              [ -n "$values" ] && args+=(-f "$chart/$values")
              echo "::group::${values:-values.yaml}, $mode"
              helm lint --strict "$chart" "${args[@]}"
              helm template ledger "$chart" "${args[@]}" \
                | kubeconform -strict -summary -kubernetes-version "$K8S_VERSION"
              echo "::endgroup::"
            done
          done
      - name: The chart refuses unsafe settings
        run: |
          chart=deploy/helm/ledger
          ! helm template ledger "$chart" --set replicaCount=2 2>/dev/null || { echo "replicaCount=2 was accepted"; exit 1; }
          ! helm template ledger "$chart" --set mode=paper 2>/dev/null || { echo "mode=paper was accepted"; exit 1; }
          echo "Both refused, as expected"
      - name: Shell scripts
        run: shellcheck -x run.sh kube.sh scripts/lib/common.sh

  deploy:
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # logged NAME COMMAND...: run a command, and on failure show the end of its output as an annotation
      LOGGED: |
        logged() {
          local name="$1"; shift
          local log="$RUNNER_TEMP/$(echo "$name" | tr -c 'a-zA-Z0-9' '_').log"
          if ! "$@" > >(tee "$log") 2>&1; then
            sleep 1; python3 .github/scripts/annotate.py error "$name" "$log"; return 1
          fi
        }
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: ./kube.sh up
        run: |
          eval "$LOGGED"
          logged "./kube.sh up" ./kube.sh up --no-update --no-browser --no-system-packages
      - name: ./kube.sh status
        run: ./kube.sh status
      - name: ./kube.sh test
        run: |
          eval "$LOGGED"
          logged "./kube.sh test" ./kube.sh test
      - name: The model registry records each dashboard's models in MLflow
        run: |
          # Calls the app's API; on an HTTP error, shows the status and body as an annotation
          api() {
            local out code
            out="$(curl -sS -w '\n%{http_code}' -H 'Host: ledger.localhost' "http://127.0.0.1:8080/api/$1" "${@:2}")"
            code="${out##*$'\n'}"; out="${out%$'\n'*}"
            if [ "${code:0:1}" != 2 ]; then echo "::error title=API $1::HTTP $code ${out:0:500}" >&2; return 1; fi
            printf '%s' "$out"
          }
          status="$(curl -sS -o "$RUNNER_TEMP/mlflow-health" -w '%{http_code}' -H 'Host: mlflow.localhost' http://127.0.0.1:8080/health)"
          echo "MLflow through the ingress: HTTP $status $(head -c 300 "$RUNNER_TEMP/mlflow-health")"
          if [ "$status" != 200 ]; then
            echo "::error title=MLflow ingress::HTTP $status $(head -c 300 "$RUNNER_TEMP/mlflow-health")"; exit 1
          fi
          # The demo fills both dashboards at startup; each analysis registers a model version
          for universe in stocks crypto; do
            for _ in $(seq 1 90); do
              count="$(api "$universe/models" | jq '.versions | length')"
              [ "$count" -ge 1 ] && break
              sleep 10
            done
            api "$universe/models" | jq -e '.tracking_uri | startswith("http://ledger-mlflow")' >/dev/null
            echo "$universe: $count version(s), champion $(api "$universe/models" | jq -r .champion)"
            [ "$count" -ge 1 ]
          done
          # Pin version 1, then unpin
          api crypto/models/1/promote -X POST -H 'Content-Type: application/json' -d '{}' | jq -e '.pinned and .champion == "1"'
          api crypto/models/unpin -X POST | jq -e '.pinned | not'
      - name: An alert scan from a CronJob reaches the server
        run: |
          kubectl --context k3d-ledger -n ledger create job scan-check --from=cronjob/ledger-scan-crypto-close
          kubectl --context k3d-ledger -n ledger wait --for=condition=complete job/scan-check --timeout=10m
          kubectl --context k3d-ledger -n ledger logs job/scan-check
      - name: ./kube.sh predict-now
        run: |
          eval "$LOGGED"
          logged "./kube.sh predict-now" ./kube.sh predict-now
      - name: ./kube.sh results
        run: |
          ./kube.sh results "$RUNNER_TEMP/results"
          find "$RUNNER_TEMP/results" -type f | sort
          test -f "$(find "$RUNNER_TEMP/results" -name report.md | head -1)"
          cat "$(find "$RUNNER_TEMP/results" -name report.md | head -1)" >> "$GITHUB_STEP_SUMMARY"
      - name: An upgrade keeps the data
        run: |
          api() { curl -fsS -H 'Host: ledger.localhost' "http://127.0.0.1:8080/api/$1"; }
          k() { kubectl --context k3d-ledger -n ledger "$@"; }
          volume_before="$(k get pvc ledger-data -o jsonpath='{.metadata.uid}')"
          runs_before="$(api stocks/runs | jq length)"
          ./kube.sh up --no-update --no-browser --no-system-packages --profile desktop
          volume_after="$(k get pvc ledger-data -o jsonpath='{.metadata.uid}')"
          runs_after="$(api stocks/runs | jq length)"
          echo "volume $volume_before -> $volume_after, stored runs $runs_before -> $runs_after"
          [ "$volume_before" = "$volume_after" ] && [ "$runs_after" -ge "$runs_before" ]
      - name: ./kube.sh down keeps the volumes
        run: |
          ./kube.sh down
          kubectl --context k3d-ledger -n ledger get pvc ledger-data ledger-predictions
      - name: Diagnostics
        if: failure()
        run: |
          k() { kubectl --context k3d-ledger -n ledger "$@"; }
          note() { python3 .github/scripts/annotate.py warning "$1" "$2"; }
          d="$RUNNER_TEMP/diag"; mkdir -p "$d"
          {
            k get pods -o wide
            echo
            k get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .status.containerStatuses[*]}  {.name}: restarts={.restartCount} last={.lastState.terminated.reason} exit={.lastState.terminated.exitCode}{"\n"}{end}{end}'
          } > "$d/pods.log" 2>&1 || true
          k logs deployment/ledger --previous --tail=60 > "$d/server-previous.log" 2>&1 || echo "(no previous container)" > "$d/server-previous.log"
          k logs deployment/ledger --tail=60 > "$d/server.log" 2>&1 || true
          k logs deployment/ledger-mlflow --tail=60 > "$d/mlflow.log" 2>&1 || true
          k get events --sort-by=.lastTimestamp | tail -40 > "$d/events.log" 2>&1 || true
          for f in pods server-previous server mlflow events; do echo "::group::$f"; cat "$d/$f.log"; echo "::endgroup::"; note "$f" "$d/$f.log"; done
      - name: ./kube.sh destroy
        if: always()
        run: ./kube.sh destroy --yes
