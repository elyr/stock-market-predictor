# Checks the Helm chart and kube.sh end to end on throwaway k3d clusters:
#   1. chart: helm lint and schema validation of the rendered manifests, alert rules
#   2. deploy: ./kube.sh up, the chart's tests, MLflow, monitoring, a prediction
#      job, its results, an upgrade, down
#   3. gitops: Flux deploys the chart from this branch on GitHub

name: Kubernetes

on:
  push:
    branches: [main]
    paths: &deploy_paths
      - deploy/**
      - kube.sh
      - scripts/**
      - Dockerfile
      - requirements.txt
      - api/**
      - src/**
      - config/**
      - .github/workflows/kubernetes.yml
      - .github/scripts/**
  pull_request:
    paths: *deploy_paths
  workflow_dispatch:

concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.6.7
  PROMETHEUS_VERSION: 3.5.0
  K8S_VERSION: 1.31.0
  FLUX_VERSION: 2.7.5

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
      - name: Lint and validate each profile
        run: |
          chart=deploy/helm/ledger
          for values in "" values-laptop.yaml values-desktop.yaml; do
            for mode in demo live; do
              for variant in sqlite "postgres+monitoring"; do
                args=(--set mode=$mode --set-file configFile=config/config.yaml)
                [ "$variant" = sqlite ] || args+=(--set monitoring.enabled=true --set database.type=postgresql \
                  --set queue.type=redis --set replicaCount=2)
                [ -n "$values" ] && args+=(-f "$chart/$values")
                echo "::group::${values:-values.yaml}, $mode, $variant"
                helm lint --strict "$chart" "${args[@]}"
                helm template ledger "$chart" "${args[@]}" \
                  | kubeconform -strict -summary -kubernetes-version "$K8S_VERSION"
                echo "::endgroup::"
              done
            done
          done
      - name: Alert rules and their tests (promtool)
        run: |
          curl -fsSL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          promtool check rules deploy/helm/ledger/files/alert-rules.yaml
          promtool test rules tests/prometheus/alert-rules.test.yaml
          # The scrape configuration as the chart renders it
          helm template ledger deploy/helm/ledger --set monitoring.enabled=true --show-only templates/monitoring.yaml \
            | yq 'select(.kind == "ConfigMap" and .metadata.name == "ledger-prometheus") | .data["prometheus.yml"]' \
            | sed 's#/etc/prometheus/alert-rules.yaml#deploy/helm/ledger/files/alert-rules.yaml#' > "$RUNNER_TEMP/prometheus.yml"
          promtool check config --syntax-only "$RUNNER_TEMP/prometheus.yml"
      - name: Grafana dashboard is valid JSON with unique panel ids
        run: |
          jq -e '.uid == "ledger" and ([.panels[].id] | length == (unique | length))' deploy/helm/ledger/files/grafana-dashboard.json
      - name: The chart refuses unsafe settings
        run: |
          chart=deploy/helm/ledger
          ! helm template ledger "$chart" --set replicaCount=2 2>/dev/null || { echo "replicaCount=2 was accepted"; exit 1; }
          ! helm template ledger "$chart" --set mode=paper 2>/dev/null || { echo "mode=paper was accepted"; exit 1; }
          ! helm template ledger "$chart" --set database.type=postgresql --set replicaCount=2 2>/dev/null \
            || { echo "two servers with jobs inside them were accepted"; exit 1; }
          ! helm template ledger "$chart" --set queue.type=redis --set mlflow.enabled=false 2>/dev/null \
            || { echo "workers without a shared model registry were accepted"; exit 1; }
          echo "All refused, as expected"
      - name: Shell scripts
        run: shellcheck -x run.sh kube.sh scripts/lib/common.sh

  deploy:
    needs: chart
    runs-on: ubuntu-latest
    # Deploy, tests, MLflow, monitoring, prediction, upgrade and a disaster drill
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    env:
      # logged NAME COMMAND...: run a command, and on failure show the end of its output as an annotation
      LOGGED: |
        logged() {
          local name="$1"; shift
          local log="$RUNNER_TEMP/$(echo "$name" | tr -c 'a-zA-Z0-9' '_').log"
          if ! "$@" > >(tee "$log") 2>&1; then
            sleep 1; python3 .github/scripts/annotate.py error "$name" "$log"; return 1
          fi
        }
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: ./kube.sh up --monitoring
        run: |
          eval "$LOGGED"
          logged "./kube.sh up" ./kube.sh up --no-update --no-browser --no-system-packages --monitoring
      - name: ./kube.sh status
        run: ./kube.sh status
      - name: ./kube.sh test
        run: |
          eval "$LOGGED"
          logged "./kube.sh test" ./kube.sh test
      - name: The model registry records each dashboard's models in MLflow
        run: |
          # Calls the app's API; on an HTTP error, shows the status and body as an annotation
          api() {
            local out code
            out="$(curl -sS -w '\n%{http_code}' -H 'Host: ledger.localhost' "http://127.0.0.1:8080/api/$1" "${@:2}")"
            code="${out##*$'\n'}"; out="${out%$'\n'*}"
            if [ "${code:0:1}" != 2 ]; then echo "::error title=API $1::HTTP $code ${out:0:500}" >&2; return 1; fi
            printf '%s' "$out"
          }
          status="$(curl -sS -o "$RUNNER_TEMP/mlflow-health" -w '%{http_code}' -H 'Host: mlflow.localhost' http://127.0.0.1:8080/health)"
          echo "MLflow through the ingress: HTTP $status $(head -c 300 "$RUNNER_TEMP/mlflow-health")"
          if [ "$status" != 200 ]; then
            echo "::error title=MLflow ingress::HTTP $status $(head -c 300 "$RUNNER_TEMP/mlflow-health")"; exit 1
          fi
          # The demo fills both dashboards at startup; each analysis registers a model version
          for universe in stocks crypto; do
            for _ in $(seq 1 90); do
              count="$(api "$universe/models" | jq '.versions | length')"
              [ "$count" -ge 1 ] && break
              sleep 10
            done
            api "$universe/models" | jq -e '.tracking_uri | startswith("http://ledger-mlflow")' >/dev/null
            echo "$universe: $count version(s), champion $(api "$universe/models" | jq -r .champion)"
            [ "$count" -ge 1 ]
          done
          # Pin version 1, then unpin
          api crypto/models/1/promote -X POST -H 'Content-Type: application/json' -d '{}' | jq -e '.pinned and .champion == "1"'
          api crypto/models/unpin -X POST | jq -e '.pinned | not'
      - name: Prometheus scrapes the app and Grafana shows the dashboard
        run: |
          get() {  # get HOST PATH [curl args]: fail with the status and body as an annotation
            local out code
            out="$(curl -sS -w '\n%{http_code}' -H "Host: $1" "http://127.0.0.1:8080$2" "${@:3}")"
            code="${out##*$'\n'}"; out="${out%$'\n'*}"
            if [ "${code:0:1}" != 2 ]; then echo "::error title=$1$2::HTTP $code ${out:0:500}" >&2; return 1; fi
            printf '%s' "$out"
          }
          curl -fsS -H 'Host: ledger.localhost' http://127.0.0.1:8080/metrics | grep -E '^ledger_(info|http_requests_total)' | head -5
          for _ in $(seq 1 30); do
            health="$(get prometheus.localhost /api/v1/targets | jq -r '.data.activeTargets[] | select(.labels.job == "ledger") | .health')"
            [ "$health" = up ] && break
            sleep 5
          done
          echo "Prometheus target 'ledger': $health"; [ "$health" = up ]
          rules="$(get prometheus.localhost /api/v1/rules | jq '[.data.groups[].rules[]] | length')"
          echo "Alert rules loaded: $rules"; [ "$rules" -ge 8 ]
          get prometheus.localhost '/api/v1/query?query=ledger_info' | jq -e '.data.result | length == 1' >/dev/null
          password="$(kubectl --context k3d-ledger -n ledger get secret ledger-grafana -o jsonpath='{.data.admin-password}' | base64 -d)"
          get grafana.localhost /api/search?query=Ledger -u "admin:$password" | jq -e 'map(.uid) | index("ledger")' >/dev/null
          get grafana.localhost /api/datasources/uid/prometheus/health -u "admin:$password" | jq -e '.status == "OK"'
          echo "Grafana: dashboard provisioned, Prometheus data source healthy"
      - name: An alert scan from a CronJob reaches the server
        run: |
          kubectl --context k3d-ledger -n ledger create job scan-check --from=cronjob/ledger-scan-crypto-close
          kubectl --context k3d-ledger -n ledger wait --for=condition=complete job/scan-check --timeout=10m
          kubectl --context k3d-ledger -n ledger logs job/scan-check
      - name: ./kube.sh predict-now
        run: |
          eval "$LOGGED"
          logged "./kube.sh predict-now" ./kube.sh predict-now
      - name: ./kube.sh results
        run: |
          ./kube.sh results "$RUNNER_TEMP/results"
          find "$RUNNER_TEMP/results" -type f | sort
          test -f "$(find "$RUNNER_TEMP/results" -name report.md | head -1)"
          cat "$(find "$RUNNER_TEMP/results" -name report.md | head -1)" >> "$GITHUB_STEP_SUMMARY"
      - name: An upgrade keeps the data
        run: |
          api() { curl -fsS -H 'Host: ledger.localhost' "http://127.0.0.1:8080/api/$1"; }
          k() { kubectl --context k3d-ledger -n ledger "$@"; }
          volume_before="$(k get pvc ledger-data -o jsonpath='{.metadata.uid}')"
          runs_before="$(api stocks/runs | jq length)"
          eval "$LOGGED"
          logged "./kube.sh up --profile desktop" ./kube.sh up --no-update --no-browser --no-system-packages --profile desktop
          volume_after="$(k get pvc ledger-data -o jsonpath='{.metadata.uid}')"
          runs_after="$(api stocks/runs | jq length)"
          echo "volume $volume_before -> $volume_after, stored runs $runs_before -> $runs_after"
          [ "$volume_before" = "$volume_after" ] && [ "$runs_after" -ge "$runs_before" ]
          # up without --monitoring keeps monitoring on
          k get deployment ledger-prometheus ledger-grafana
      - name: "Disaster recovery: back up, lose the data volume, restore"
        timeout-minutes: 20
        run: |
          eval "$LOGGED"
          # Retries: right after a restart the ingress can still route to the old pod for a moment
          api() { curl -fsS --retry 10 --retry-all-errors --retry-delay 3 -H 'Host: ledger.localhost' "http://127.0.0.1:8080/api/$1"; }
          k() { kubectl --context k3d-ledger -n ledger "$@"; }
          runs() { for u in stocks crypto; do api "$u/runs" | jq -c '[.[] | {id, data_date, rank_ic}]'; done; }
          runs > "$RUNNER_TEMP/runs-before.json"
          versions_before="$(api crypto/models | jq '.versions | length')"
          logged "./kube.sh backup" ./kube.sh backup "$RUNNER_TEMP/backups"
          archive="$(ls "$RUNNER_TEMP/backups"/ledger-backup-*.tar.gz)"
          python3 scripts/backup.py verify "$archive"

          # Lose the database volume entirely; up recreates it empty (and demo mode seeds new data)
          k scale deployment/ledger --replicas=0
          k wait --for=delete pod -l app.kubernetes.io/component=server --timeout=3m
          # Finished job pods (the backup, the prediction) still reference volumes, which
          # Kubernetes then refuses to delete: remove them first
          k delete jobs --all --wait --timeout=2m
          k delete pvc ledger-data --wait --timeout=3m
          logged "./kube.sh up (fresh volume)" ./kube.sh up --no-update --no-browser --no-system-packages --profile desktop
          ! diff -q <(runs) "$RUNNER_TEMP/runs-before.json" >/dev/null || { echo "expected different data before the restore"; exit 1; }

          # Restore the copy from this computer
          logged "./kube.sh restore" ./kube.sh restore "$archive" --yes
          runs > "$RUNNER_TEMP/runs-after.json"
          diff "$RUNNER_TEMP/runs-before.json" "$RUNNER_TEMP/runs-after.json"
          [ "$(api crypto/models | jq '.versions | length')" = "$versions_before" ]
          echo "Restored: same runs and $versions_before model versions as before"
      - name: ./kube.sh down keeps the volumes
        run: |
          ./kube.sh down
          kubectl --context k3d-ledger -n ledger get pvc ledger-data ledger-predictions
      - name: Diagnostics
        if: failure()
        run: |
          k() { kubectl --context k3d-ledger -n ledger "$@"; }
          note() { python3 .github/scripts/annotate.py warning "$1" "$2"; }
          d="$RUNNER_TEMP/diag"; mkdir -p "$d"
          {
            k get pods -o wide
            echo
            k get pods -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{range .status.containerStatuses[*]}  {.name}: restarts={.restartCount} last={.lastState.terminated.reason} exit={.lastState.terminated.exitCode}{"\n"}{end}{end}'
          } > "$d/pods.log" 2>&1 || true
          k logs deployment/ledger --previous --tail=60 > "$d/server-previous.log" 2>&1 || echo "(no previous container)" > "$d/server-previous.log"
          k logs deployment/ledger --tail=60 > "$d/server.log" 2>&1 || true
          k logs deployment/ledger-mlflow --tail=60 > "$d/mlflow.log" 2>&1 || true
          k get events --sort-by=.lastTimestamp | tail -40 > "$d/events.log" 2>&1 || true
          for f in pods server-previous server mlflow events; do echo "::group::$f"; cat "$d/$f.log"; echo "::endgroup::"; note "$f" "$d/$f.log"; done
      - name: ./kube.sh destroy
        if: always()
        run: ./kube.sh destroy --yes

  gitops:
    needs: chart
    # Flux reads the branch from GitHub, so it must be a branch of this repository
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
      LOGGED: |
        logged() {
          local name="$1"; shift
          local log="$RUNNER_TEMP/$(echo "$name" | tr -c 'a-zA-Z0-9' '_').log"
          if ! "$@" > >(tee "$log") 2>&1; then
            sleep 1; python3 .github/scripts/annotate.py error "$name" "$log"; return 1
          fi
        }
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install k3d and the Flux command line
        run: |
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          curl -fsSL https://fluxcd.io/install.sh | sudo FLUX_VERSION="$FLUX_VERSION" bash
          flux version --client
      - name: The GitOps manifests build
        run: |
          kubectl kustomize deploy/gitops/apps/ledger | tee "$RUNNER_TEMP/apps.yaml"
          yq -e 'select(.kind == "ConfigMap") | .data["values.yaml"] | contains("ghcr.io/elyr/stock-market-predictor")' "$RUNNER_TEMP/apps.yaml"
      - name: ./kube.sh up --gitops --build
        run: |
          eval "$LOGGED"
          logged "./kube.sh up --gitops" ./kube.sh up --gitops --build --branch "$BRANCH" \
            --no-update --no-browser --no-system-packages
      - name: Flux runs the release from git, with the image built here
        run: |
          flux --context k3d-ledger get all -n flux-system
          kubectl --context k3d-ledger -n flux-system wait helmrelease/ledger --for=condition=Ready --timeout=5m
          image="$(kubectl --context k3d-ledger -n ledger get deployment ledger -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Running $image"
          [[ "$image" == ghcr.io/elyr/stock-market-predictor:* ]]
          revision="$(kubectl --context k3d-ledger -n flux-system get gitrepository ledger -o jsonpath='{.status.artifact.revision}')"
          echo "Git revision: $revision"
          [[ "$revision" == "$BRANCH@sha1:"* ]]
      - name: ./kube.sh test
        run: ./kube.sh test
      - name: Back to Helm with --no-gitops (the data is kept)
        run: |
          volume="$(kubectl --context k3d-ledger -n ledger get pvc ledger-data -o jsonpath='{.metadata.uid}')"
          eval "$LOGGED"
          logged "./kube.sh up --no-gitops" ./kube.sh up --no-gitops --no-update --no-browser --no-system-packages
          ! kubectl --context k3d-ledger -n flux-system get helmrelease ledger 2>/dev/null
          [ "$(kubectl --context k3d-ledger -n ledger get pvc ledger-data -o jsonpath='{.metadata.uid}')" = "$volume" ]
          echo "Helm release from this folder, same data volume"
      - name: Diagnostics
        if: failure()
        run: |
          d="$RUNNER_TEMP/diag"; mkdir -p "$d"
          flux --context k3d-ledger get all -A > "$d/flux.log" 2>&1 || true
          flux --context k3d-ledger logs --all-namespaces --level=error --tail=40 > "$d/flux-errors.log" 2>&1 || true
          kubectl --context k3d-ledger -n ledger get pods -o wide > "$d/pods.log" 2>&1 || true
          kubectl --context k3d-ledger -n ledger get events --sort-by=.lastTimestamp | tail -30 > "$d/events.log" 2>&1 || true
          for f in flux flux-errors pods events; do echo "::group::$f"; cat "$d/$f.log"; echo "::endgroup::"; python3 .github/scripts/annotate.py warning "$f" "$d/$f.log"; done
      - name: ./kube.sh destroy
        if: always()
        run: ./kube.sh destroy --yes

  scaled:
    # SQLite first, then ./kube.sh up --postgres: the data moves to PostgreSQL,
    # two servers and a worker run, and a restart does not interrupt the app
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      LOGGED: |
        logged() {
          local name="$1"; shift
          local log="$RUNNER_TEMP/$(echo "$name" | tr -c 'a-zA-Z0-9' '_').log"
          if ! "$@" > >(tee "$log") 2>&1; then
            sleep 1; python3 .github/scripts/annotate.py error "$name" "$log"; return 1
          fi
        }
      API: |
        api() {
          local out code
          out="$(curl -sS -w '\n%{http_code}' -H 'Host: ledger.localhost' "http://127.0.0.1:8080/api/$1" "${@:2}")"
          code="${out##*$'\n'}"; out="${out%$'\n'*}"
          if [ "${code:0:1}" != 2 ]; then echo "::error title=API $1::HTTP $code ${out:0:500}" >&2; return 1; fi
          printf '%s' "$out"
        }
        k() { kubectl --context k3d-ledger -n ledger "$@"; }
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
      - name: ./kube.sh up (SQLite), and wait for the demo data
        run: |
          eval "$LOGGED"; eval "$API"
          logged "./kube.sh up" ./kube.sh up --no-update --no-browser --no-system-packages
          for _ in $(seq 1 90); do
            [ "$(api stocks/runs | jq length)" -ge 1 ] && [ "$(api crypto/runs | jq length)" -ge 1 ] \
              && [ "$(api jobs | jq '[.[] | select(.status == "queued" or .status == "running")] | length')" = 0 ] && break
            sleep 10
          done
          for u in stocks crypto; do api "$u/runs" | jq -c '[.[] | {id, data_date, rank_ic}]'; done > "$RUNNER_TEMP/runs-sqlite.json"
          wc -c "$RUNNER_TEMP/runs-sqlite.json"
      - name: ./kube.sh up --postgres moves the data
        run: |
          eval "$LOGGED"; eval "$API"
          logged "./kube.sh up --postgres" ./kube.sh up --postgres --no-update --no-browser --no-system-packages
          api ready | jq -e '.database == "postgresql" and .job_queue == "redis"'
          for u in stocks crypto; do api "$u/runs" | jq -c '[.[] | {id, data_date, rank_ic}]'; done > "$RUNNER_TEMP/runs-postgres.json"
          diff "$RUNNER_TEMP/runs-sqlite.json" "$RUNNER_TEMP/runs-postgres.json"
          echo "Every stored run moved to PostgreSQL"
          k get pods -o wide
          [ "$(k get deployment ledger -o jsonpath='{.status.readyReplicas}')" = 2 ]
          [ "$(k get deployment ledger-worker -o jsonpath='{.status.readyReplicas}')" = 1 ]
      - name: A worker runs the analysis
        run: |
          eval "$API"
          job="$(api crypto/analysis -X POST -H 'Content-Type: application/json' -d '{"top_n": 5}')"
          id="$(jq -r .id <<<"$job")"
          for _ in $(seq 1 120); do
            status="$(api "jobs/$id" | jq -r .status)"
            [ "$status" = succeeded ] || [ "$status" = failed ] && break
            sleep 5
          done
          api "jobs/$id" | jq .
          api "jobs/$id" | jq -e '.status == "succeeded" and (.worker | startswith("ledger-worker"))'
      - name: Restarting the servers does not interrupt the app
        run: |
          eval "$API"
          ( failures=0; requests=0
            while [ ! -f "$RUNNER_TEMP/stop" ]; do
              requests=$((requests + 1))
              curl -fsS -o /dev/null --max-time 5 -H 'Host: ledger.localhost' http://127.0.0.1:8080/api/crypto || failures=$((failures + 1))
              sleep 0.2
            done
            echo "$requests $failures" > "$RUNNER_TEMP/availability" ) &
          k rollout restart deployment/ledger
          k rollout status deployment/ledger --timeout=10m
          sleep 5; touch "$RUNNER_TEMP/stop"; wait
          read -r requests failures < "$RUNNER_TEMP/availability"
          echo "::notice title=Availability during the restart::$requests requests, $failures failed"
          [ "$failures" -eq 0 ]
      - name: ./kube.sh test and backup on PostgreSQL
        run: |
          eval "$LOGGED"
          ./kube.sh test
          logged "./kube.sh backup" ./kube.sh backup "$RUNNER_TEMP/backups"
          python3 scripts/backup.py list --output "$RUNNER_TEMP/backups"
      - name: Diagnostics
        if: failure()
        run: |
          k() { kubectl --context k3d-ledger -n ledger "$@"; }
          d="$RUNNER_TEMP/diag"; mkdir -p "$d"
          k get pods -o wide > "$d/pods.log" 2>&1 || true
          k logs deployment/ledger --tail=60 > "$d/server.log" 2>&1 || true
          k logs deployment/ledger-worker --tail=60 > "$d/worker.log" 2>&1 || true
          k logs statefulset/ledger-postgresql --tail=40 > "$d/postgresql.log" 2>&1 || true
          k get events --sort-by=.lastTimestamp | tail -40 > "$d/events.log" 2>&1 || true
          for f in pods server worker postgresql events; do echo "::group::$f"; cat "$d/$f.log"; echo "::endgroup::"; python3 .github/scripts/annotate.py warning "$f" "$d/$f.log"; done
      - name: ./kube.sh destroy
        if: always()
        run: ./kube.sh destroy --yes
