# Runs the day's analysis and keeps the results as a downloadable artifact.
# Separate from the "Tests" workflow: it uses live market data, takes longer,
# and its outcome depends on the data source, not only on the code.
#
# Results: Actions > Daily analysis > a run > "Artifacts" (and the run's
# summary page shows the report).

name: Daily analysis

on:
  schedule:
    # 21:30 UTC, after the US close all year (16:00 New York = 20:00 or 21:00 UTC)
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      universes:
        description: Which dashboards to run
        type: choice
        options: [both, stocks, crypto]
        default: both
      demo:
        description: Use simulated prices instead of live data
        type: boolean
        default: false
  push:
    # Also run when the script or this workflow changes, to check them end to end
    paths:
      - scripts/daily_analysis.py
      - .github/workflows/daily-analysis.yml

permissions:
  contents: read

concurrency:
  group: daily-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide what to run
        id: plan
        env:
          # Inputs are passed through the environment, never expanded into the script
          CHOICE: ${{ inputs.universes || 'both' }}
          DEMO: ${{ inputs.demo && '--demo' || '' }}
        run: |
          case "$CHOICE" in
            stocks) universes="stocks" ;;
            crypto) universes="crypto" ;;
            *)
              # Stock markets are closed at weekends; crypto trades every day
              if [ "$(date -u +%u)" -ge 6 ]; then universes="crypto"; else universes="stocks crypto"; fi ;;
          esac
          echo "universes=$universes" >> "$GITHUB_OUTPUT"
          echo "demo=$DEMO" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Run the analysis
        env:
          UNIVERSES: ${{ steps.plan.outputs.universes }}
          DEMO: ${{ steps.plan.outputs.demo }}
        # Word splitting is intended: UNIVERSES may hold "stocks crypto"
        run: python scripts/daily_analysis.py --universe $UNIVERSES $DEMO --output-dir predictions

      - name: Save results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-analysis-${{ steps.plan.outputs.date }}-run${{ github.run_number }}
          path: predictions/
          retention-days: 90
          if-no-files-found: warn
