name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # Offline suite: synthetic data only, no Yahoo Finance access needed
      - run: python -m pytest

  # The same suite with the app on PostgreSQL and jobs on a Redis queue
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ledger@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/0
      # The API tests too run on PostgreSQL
      TEST_API_ON_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_store_backends.py tests/test_queue.py tests/test_api.py tests/test_backup.py tests/test_registry.py tests/test_metrics.py tests/test_signals.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  presentation:
    # The deck is generated: make sure build.js still produces it
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/presentation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/presentation/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: test -s Ledger.pptx
