name: Tests

on:
  push:
  pull_request:
    # labeled: adding the changes-output label re-runs the checks without the Snapshots job
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      # Offline suite: synthetic data only, no Yahoo Finance access needed
      - run: python -m pytest

  # The pull request must not change what an analysis produces: record the base
  # branch's output, then compare (tests/test_snapshots.py). Both run here, so
  # library versions cannot make a difference. Label a pull request
  # changes-output when it changes the numbers on purpose.
  snapshots:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'changes-output')
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Record the base branch's output
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cp tests/test_snapshots.py "$RUNNER_TEMP/base/tests/"
          cd "$RUNNER_TEMP/base"
          SNAPSHOT_DIR="$RUNNER_TEMP/snapshots" UPDATE_SNAPSHOTS=1 python -m pytest -q tests/test_snapshots.py
      - name: Compare this pull request's output
        run: SNAPSHOT_DIR="$RUNNER_TEMP/snapshots" python -m pytest -q -rs tests/test_snapshots.py

  # The same suite with the app on PostgreSQL and jobs on a Redis queue
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ledger
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:ledger@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/0
      # The API tests too run on PostgreSQL
      TEST_API_ON_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/test_store_backends.py tests/test_queue.py tests/test_api.py tests/test_backup.py tests/test_registry.py tests/test_metrics.py tests/test_signals.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  presentation:
    # The deck is generated: make sure build.js still produces it
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/presentation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/presentation/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: test -s Ledger.pptx
