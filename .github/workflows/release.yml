# Builds the image once, scans it, and publishes it:
#
#   pull request   build and scan only
#   push to main   publish ghcr.io/elyr/stock-market-predictor:<sha> and :main,
#                  then record that tag in deploy/gitops/ so Flux deploys it
#   tag vX.Y.Z     publish :X.Y.Z and :X.Y, the Helm chart to
#                  oci://ghcr.io/elyr/charts, and a GitHub release with the
#                  changelog's notes
#
# Images carry build provenance and an SBOM. See docs/RELEASING.md.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - docs/**
      - deploy/gitops/apps/**
      - .github/ISSUE_TEMPLATE/**
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - api/**
      - src/**
      - scripts/**
      - frontend/**
      - config/**
      - .github/workflows/release.yml
  workflow_dispatch:

# Each job asks for exactly what it needs
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  GRYPE_VERSION: 0.100.0

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        run: |
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          publish=false
          [ "${{ github.event_name }}" = push ] && publish=true
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image labels and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Ledger
            org.opencontainers.image.description=Stock and crypto outlook with the evidence attached
            org.opencontainers.image.licenses=MIT

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ledger:scan
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan for vulnerabilities (Grype)
        run: |
          curl -fsSL "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin grype
          grype ledger:scan --only-fixed -o table | tee "$RUNNER_TEMP/grype.txt" | tail -40
          grype ledger:scan --only-fixed -o sarif > grype.sarif
          {
            echo "### Image vulnerabilities with a fix available"
            echo '```'
            head -60 "$RUNNER_TEMP/grype.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Fail on critical problems that have a fix; the rest is reported
          grype ledger:scan --only-fixed --fail-on critical -q -o table >/dev/null

      - name: Upload the scan to GitHub code scanning
        # Code scanning is not available in private repositories, and Dependabot
        # runs get a read-only token: the upload fails in both cases. The Grype
        # gate above does not depend on this step.
        if: always() && hashFiles('grype.sarif') != '' && !github.event.repository.private && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: grype.sarif
          category: image

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish (with provenance and SBOM)
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_COMMIT=${{ steps.version.outputs.tag }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true

      - name: Summary
        if: steps.version.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  gitops:
    # Record the new image in git; Flux (./kube.sh up --gitops) deploys it from there
    needs: image
    if: github.ref == 'refs/heads/main' && needs.image.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true  # this job pushes the deploy commit
      - name: Point deploy/gitops at the new image
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          file=deploy/gitops/apps/ledger/release-values.yaml
          yq -i ".image.tag = \"$TAG\"" "$file"
          if git diff --quiet; then echo "Already at $TAG"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy image $TAG with Flux"
          # Another merge may have landed meanwhile: rebase and retry
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

  chart:
    # Releases only: the chart in GHCR as an OCI artifact, and a GitHub release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Package and publish the chart
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          yq -i ".version = \"$version\" | .appVersion = \"$version\"" deploy/helm/ledger/Chart.yaml
          yq -i ".image.repository = \"$IMAGE\" | .image.tag = \"$version\"" deploy/helm/ledger/values.yaml
          helm package deploy/helm/ledger --destination dist
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          helm push "dist/ledger-$version.tgz" "oci://ghcr.io/$OWNER/charts"
      - name: GitHub release with the changelog's notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "Image: \`$IMAGE:$version\`  "
            echo "Chart: \`helm install ledger oci://ghcr.io/$OWNER/charts/ledger --version $version\`"
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tgz --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
