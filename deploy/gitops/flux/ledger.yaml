# Flux watches this repository and keeps the cluster in line with
# deploy/gitops/apps/: what is in git is what runs. Applied once by
# ./kube.sh up --gitops (which sets the branch); everything after that comes
# from git.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ledger
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/elyr/stock-market-predictor
  ref:
    branch: main
  # Only the chart and the deployment files matter to the cluster
  ignore: |
    /*
    !/deploy/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ledger
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: ledger
  path: ./deploy/gitops/apps/ledger
  prune: true
  wait: false
