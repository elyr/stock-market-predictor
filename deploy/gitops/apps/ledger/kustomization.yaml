# What Flux applies from git. The image version to run is in
# release-values.yaml, which the Release workflow updates after each image it
# publishes; reverting that commit rolls the cluster back.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
configMapGenerator:
  - name: ledger-release
    namespace: flux-system
    files:
      - values.yaml=release-values.yaml
generatorOptions:
  disableNameSuffixHash: true
