# Prometheus alert rules for Ledger. Firing alerts show in Prometheus
# (Alerts page) and on the Grafana dashboard. Checked in CI with promtool.
#
# Each server and worker pod is scraped on its own: counts are summed over
# pods, and values every server reads from the database (data age, model
# skill) are taken once with max.
groups:
  - name: ledger-service
    rules:
      - alert: LedgerDown
        expr: up{job="ledger"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: The Ledger server does not answer
          description: Prometheus has not reached /metrics for 2 minutes. Check the pod with ./kube.sh status.

      - alert: LedgerHighErrorRate
        expr: |
          sum(rate(ledger_http_requests_total{status=~"5.."}[10m]))
            / sum(rate(ledger_http_requests_total[10m])) > 0.05
          and sum(rate(ledger_http_requests_total[10m])) > 0.01
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: More than 5% of requests fail
          description: '{{ $value | humanizePercentage }} of requests returned a server error over 10 minutes.'

      - alert: LedgerJobFailed
        expr: sum by (kind, universe) (increase(ledger_jobs_total{status="failed"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: 'A {{ $labels.kind }} job failed for {{ $labels.universe }}'
          description: The job's error is shown in the app and in the server logs (./kube.sh logs).

  - name: ledger-schedule
    rules:
      # Scans run at 09:45 and 16:15 New York time: every day for crypto, on
      # weekdays for stocks. The limits allow for the longest normal gap.
      - alert: LedgerCryptoScansLate
        expr: time() - max by (kind, universe) (ledger_job_last_success_timestamp_seconds{kind="scan", universe="crypto"}) > 20 * 3600
        labels: { severity: warning }
        annotations:
          summary: No crypto alert scan has succeeded for 20 hours
          description: Check the scan CronJobs (kubectl get cronjobs,jobs -n ledger).

      - alert: LedgerStockScansLate
        expr: time() - max by (kind, universe) (ledger_job_last_success_timestamp_seconds{kind="scan", universe="stocks"}) > 70 * 3600
        labels: { severity: warning }
        annotations:
          summary: No stock alert scan has succeeded for 70 hours
          description: Check the scan CronJobs (kubectl get cronjobs,jobs -n ledger).

  - name: ledger-data-and-models
    rules:
      - alert: LedgerAnalysisStale
        expr: |
          max by (universe) (ledger_data_age_days{universe="crypto"}) > 2
          or max by (universe) (ledger_data_age_days{universe="stocks"}) > 4
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: 'The latest {{ $labels.universe }} analysis uses prices {{ $value }} days old'
          description: Run an analysis, or check that the data source still answers.

      - alert: LedgerLiveSkillNegative
        expr: max by (universe) (ledger_live_rank_ic) < 0 and max by (universe) (ledger_live_scored_runs) >= 15
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.universe }} picks have done worse than chance over the last 15 scored analyses'
          description: >-
            The average rank IC of recent live predictions is {{ $value | printf "%.3f" }}. Compare model
            versions on the Models page and consider rolling back.

      - alert: LedgerModelWithoutSkill
        expr: max by (universe) (ledger_model_rank_ic_t_stat) < 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: 'The current {{ $labels.universe }} model ranks worse than chance on its test dates'
          description: 't = {{ $value | printf "%.1f" }} on the most recent dates before its training data ended.'

      - alert: LedgerForecastRangesUnreliable
        expr: |
          max by (universe, horizon) (ledger_forecast_coverage{level="90"}) < 0.8
          and max by (universe, horizon) (ledger_forecast_scored) >= 50
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: '{{ $labels.universe }} {{ $labels.horizon }} price ranges held only {{ $value | humanizePercentage }} of the time'
          description: >-
            90% ranges should contain the outcome about 90% of the time. Lower means markets became more turbulent
            than the model expects; the ranges catch up as volatility estimates adapt.
