# Desktop profile (e.g. 8 cores / 16 threads, 32 GB RAM): more room for training and backtests.
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "8"
    memory: 8Gi
dailyPrediction:
  resources:
    limits:
      cpu: "6"
      memory: 6Gi
monitoring:
  prometheus:
    # More history; the volume size stays as in values.yaml, because k3d's
    # storage cannot grow an existing volume (an upgrade would be refused)
    retention: 30d
