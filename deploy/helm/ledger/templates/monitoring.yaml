{{- if .Values.monitoring.enabled }}
{{- $fullname := include "ledger.fullname" . }}
{{- $prom := printf "%s-prometheus" $fullname }}
{{- $grafana := printf "%s-grafana" $fullname }}
{{- $m := .Values.monitoring }}
# Monitoring: Prometheus scrapes the server's /metrics and evaluates the alert
# rules; Grafana shows the Ledger dashboard. Both are optional
# (./kube.sh up --monitoring).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ $m.prometheus.scrapeInterval }}
      evaluation_interval: {{ $m.prometheus.scrapeInterval }}
    rule_files:
      - /etc/prometheus/alert-rules.yaml
    scrape_configs:
      # Every server and worker pod (annotated prometheus.io/scrape), so each
      # copy is scraped on its own: job="ledger" for servers, "ledger-worker" for workers
      - job_name: ledger
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [{{ .Release.Namespace | quote }}]
            selectors:
              - role: pod
                label: "app.kubernetes.io/instance={{ .Release.Name }}"
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            regex: worker
            replacement: ledger-worker
            target_label: job
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - target_label: mode
            replacement: {{ .Values.mode }}
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  alert-rules.yaml: |
    {{- .Files.Get "files/alert-rules.yaml" | nindent 4 }}
---
# Prometheus may list the pods of this namespace to find what to scrape
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $prom }}
subjects:
  - kind: ServiceAccount
    name: {{ $prom }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $m.prometheus.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $m.prometheus.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "prometheus") | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s%s%s" $m.prometheus.scrapeInterval .Values.mode .Chart.Version (.Files.Get "files/alert-rules.yaml") | sha256sum }}
    spec:
      serviceAccountName: {{ $prom }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: prometheus
          image: {{ printf "%s:%s" $m.prometheus.image.repository $m.prometheus.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $m.prometheus.retention }}
            - --web.external-url=http://{{ $m.prometheus.ingress.host }}:8080/
            - --web.route-prefix=/
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 30
          resources:
            {{- toYaml $m.prometheus.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ $prom }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $prom }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $prom }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  ports:
    - name: http
      port: 9090
      targetPort: http
  selector:
    {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "prometheus") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $grafana }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ $prom }}:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: ledger
        folder: Ledger
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards
  ledger.json: |
    {{- .Files.Get "files/grafana-dashboard.json" | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $grafana }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $grafana }}
  {{- if and $existing $existing.data (index $existing.data "admin-password") }}
  # Keep the password chosen at install
  admin-password: {{ index $existing.data "admin-password" }}
  {{- else }}
  admin-password: {{ $m.grafana.adminPassword | default (randAlphaNum 20) | b64enc | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $grafana }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "grafana") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "grafana") | nindent 8 }}
      annotations:
        checksum/dashboard: {{ .Files.Get "files/grafana-dashboard.json" | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: grafana
          image: {{ printf "%s:%s" $m.grafana.image.repository $m.grafana.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # Anyone who can open the page sees the dashboards (read only); sign in as admin to edit
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $grafana }}, key: admin-password }
            - name: GF_SERVER_ROOT_URL
              value: http://{{ $m.grafana.ingress.host }}:8080/
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/ledger.json
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $m.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/ledger.json
              subPath: ledger.json
      volumes:
        # Everything Grafana shows is provisioned from the ConfigMap, so its own storage can be temporary
        - name: storage
          emptyDir: {}
        - name: provisioning
          configMap:
            name: {{ $grafana }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $grafana }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  ports:
    - name: http
      port: 3000
      targetPort: http
  selector:
    {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "grafana") | nindent 4 }}
{{- if .Values.ingress.enabled }}
{{- range $item := list (dict "name" $grafana "host" $m.grafana.ingress.host) (dict "name" $prom "host" $m.prometheus.ingress.host) }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $item.name }}
  labels:
    {{- include "ledger.labels" $ | nindent 4 }}
spec:
  {{- with $.Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ $item.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $item.name }}
                port:
                  name: http
{{- end }}
{{- end }}
{{- end }}
