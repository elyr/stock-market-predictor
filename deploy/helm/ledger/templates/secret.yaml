{{- $s := .Values.secrets }}
{{- if or $s.alphaVantageApiKey $s.telegramBotToken $s.telegramChatId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledger.fullname" . }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with $s.alphaVantageApiKey }}
  alpha-vantage-api-key: {{ . | quote }}
  {{- end }}
  {{- with $s.telegramBotToken }}
  telegram-bot-token: {{ . | quote }}
  {{- end }}
  {{- with $s.telegramChatId }}
  telegram-chat-id: {{ . | quote }}
  {{- end }}
{{- end }}
