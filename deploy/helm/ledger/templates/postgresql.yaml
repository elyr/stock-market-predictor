{{- if include "ledger.postgres" . }}
{{- $name := printf "%s-postgresql" (include "ledger.fullname" .) }}
{{- $pg := .Values.database.postgresql }}
{{- if not $pg.existingSecret }}
# The database URL the app uses, with a password chosen at install and kept
# across upgrades
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledger.databaseSecret" . }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "ledger.databaseSecret" .) }}
  {{- $password := "" }}
  {{- if and $existing $existing.data (index $existing.data "password") }}
  {{- $password = index $existing.data "password" | b64dec }}
  {{- else }}
  {{- $password = $pg.password | default (randAlphaNum 24) }}
  {{- end }}
  password: {{ $password | b64enc | quote }}
  {{- if $pg.url }}
  database-url: {{ $pg.url | b64enc | quote }}
  {{- else }}
  database-url: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" $pg.username $password $name $pg.database | b64enc | quote }}
  {{- end }}
{{- end }}
{{- if include "ledger.inClusterPostgres" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "database") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "ledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "database") | nindent 6 }}
  # Kept when the release is uninstalled, like the other data
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "database") | nindent 8 }}
    spec:
      # The image's own postgres user
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ printf "%s:%s" $pg.image.repository $pg.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ledger.databaseSecret" . }}
                  key: password
            # A folder inside the volume (its root may hold lost+found)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.username | quote }}, "-d", {{ $pg.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml $pg.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "ledger.componentSelectorLabels" (dict "context" . "component" "database") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
{{- end }}
{{- end }}
