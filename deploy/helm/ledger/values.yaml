# Default values for the Ledger chart.
# Local use: ./kube.sh up (see docs/KUBERNETES.md). Sizes for a laptop or a
# desktop are in values-laptop.yaml and values-desktop.yaml.

# "demo" serves simulated prices (works offline, dashboards fill themselves);
# "live" downloads real prices from Yahoo Finance.
mode: demo

nameOverride: ""
fullnameOverride: ""

image:
  repository: ledger
  tag: latest
  # The local image is loaded into the cluster by kube.sh, so never pull it
  pullPolicy: IfNotPresent

# Secrets for pulling the image from a private registry, e.g. [{name: ghcr-pull}]
imagePullSecrets: []

# Copies of the web server. Keep at 1 with SQLite or jobs run inside the server;
# with PostgreSQL, the Redis queue and MLflow it can be more (./kube.sh up --postgres).
replicaCount: 1

# Seconds a stopping server keeps answering, while traffic moves to the others
shutdownDelaySeconds: 10

# Where the app keeps its data:
#   sqlite      a file on the app's volume (one server)
#   postgresql  a PostgreSQL database: in the cluster (below), or an existing
#               one with url or existingSecret (a Secret with key database-url)
database:
  type: sqlite
  postgresql:
    url: ""
    existingSecret: ""
    image:
      repository: postgres
      tag: 17-alpine
    database: ledger
    username: ledger
    # Empty: a random password, kept across upgrades
    password: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    persistence:
      size: 5Gi
      storageClass: ""

# Where jobs run (analyses, backtests, experiments, scans):
#   inline  inside the server process
#   redis   on a Redis queue, run by the worker pods; needs mlflow.enabled
queue:
  type: inline
  redis:
    # Empty: Redis in the cluster
    url: ""
    image:
      repository: redis
      tag: 7.4-alpine
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 192Mi

worker:
  replicas: 1
  # Time for a running job to finish when a worker is replaced
  terminationGracePeriodSeconds: 120
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 3Gi

# Server log format: "json" (one JSON object per line, for log collectors) or "text"
logFormat: json

# Full config.yaml for the app. kube.sh passes the repository's file with
# --set-file configFile=config/config.yaml; when empty, the copy built into
# the image is used.
configFile: ""

secrets:
  # Optional; only used for extra data from Alpha Vantage
  alphaVantageApiKey: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # Empty uses the cluster's default ingress controller (Traefik on k3d/k3s)
  className: ""
  host: ledger.localhost
  annotations: {}

resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

persistence:
  # Database and saved models
  size: 2Gi
  # Empty uses the cluster's default storage class (local-path on k3d/k3s)
  storageClass: ""
  # Keep the data when the release is uninstalled (kube.sh down); kube.sh destroy removes the whole cluster
  keepOnUninstall: true

probes:
  startup:
    periodSeconds: 5
    failureThreshold: 36   # up to 3 minutes to start
  liveness:
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    failureThreshold: 3

# MLflow: tracks every training run and versions the models (model registry).
# Disabled: the app keeps the registry in a SQLite file on its own data volume.
mlflow:
  enabled: true
  image:
    repository: ghcr.io/mlflow/mlflow
    tag: v3.16.1
    pullPolicy: IfNotPresent
  # Web UI at http://mlflow.localhost:8080 with kube.sh
  ingress:
    enabled: true
    host: mlflow.localhost
  # Address of the UI for links from the app (kube.sh sets it with the right port)
  uiUrl: ""
  # About 560 MB in use (measured with MLflow 3.16, job execution off)
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    size: 2Gi
    storageClass: ""

# Monitoring: Prometheus (metrics and alert rules) and Grafana (dashboard).
# Off by default; ./kube.sh up --monitoring turns it on.
monitoring:
  enabled: false
  prometheus:
    image:
      repository: prom/prometheus
      tag: v3.5.0
    scrapeInterval: 30s
    retention: 7d
    ingress:
      host: prometheus.localhost
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    persistence:
      size: 2Gi
      storageClass: ""
  grafana:
    image:
      repository: grafana/grafana
      tag: 12.1.0
    # Empty: a random password, kept across upgrades (read it with ./kube.sh status)
    adminPassword: ""
    ingress:
      host: grafana.localhost
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi

# Alert scans, run by Kubernetes CronJobs instead of the server's own scheduler
signals:
  enabled: true
  timeZone: America/New_York
  scans:
    - name: stocks-open
      universe: stocks
      session: open
      schedule: "45 9 * * 1-5"    # 09:45 New York, weekdays
    - name: stocks-close
      universe: stocks
      session: close
      schedule: "15 16 * * 1-5"   # 16:15 New York, weekdays
    - name: crypto-open
      universe: crypto
      session: open
      schedule: "45 9 * * *"      # crypto trades every day
    - name: crypto-close
      universe: crypto
      session: close
      schedule: "15 16 * * *"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# The day's prediction (scripts/daily_prediction.py), saved to its own volume.
# Copy the results out with: ./kube.sh results
dailyPrediction:
  enabled: true
  timeZone: America/New_York
  schedule: "30 17 * * *"         # 17:30 New York, after the close
  # Extra arguments for the script, e.g. "--limit 40" for quicker runs
  extraArgs: ""
  activeDeadlineSeconds: 3600
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  persistence:
    size: 1Gi
    storageClass: ""

# Nightly backups of the database, the model registry and the prediction
# results (./kube.sh backup, ./kube.sh restore). See docs/KUBERNETES.md.
backup:
  enabled: true
  timeZone: America/New_York
  schedule: "30 2 * * *"          # 02:30 New York, when nothing else runs
  keep: 14                        # newest backups kept on the volume
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
